<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美式迷因產生器 | USA Meme Generator</title>

  <!-- 1. 引入 Google Fonts 美式經典風格字體 (Impact 替代風格 Impact/Bebas Neue/Anton) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <!-- 2. 引入 html2canvas CDN，用來將 HTML 區塊轉為圖片下載 -->
  <script src="https://cdnjs.cloudflare.com/ajax/org/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- 備用 html2canvas 官方 CDN -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    /* ==========================================
       CSS 樣式設定 (美式漫畫 / 新暴列主義波普風格)
       ========================================== */
    
    :root {
      --primary-color: #ff2a5f;   /* 美式美艷紅 */
      --secondary-color: #00d2ff; /* 亮美式藍 */
      --accent-color: #ffde00;    /* 美式經典黃 */
      --bg-color: #f3f3f0;        /* 背景灰白 */
      --dark-border: #121212;     /* 粗黑框顏色 */
      --box-shadow-main: 6px 6px 0px var(--dark-border); /* 立體黑陰影 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      /* 美式漫畫點陣波普背景 (Polka Dot) */
      background-image: radial-gradient(#121212 15%, transparent 16%);
      background-size: 20px 20px;
      color: #121212;
      padding: 20px 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁頭標題區塊 */
    header {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
    }

    header h1 {
      font-family: 'Bangers', 'Noto Sans TC', cursive;
      font-size: 3rem;
      letter-spacing: 2px;
      color: var(--accent-color);
      /* 經典美式立體文字邊框 */
      text-shadow: 
        3px 3px 0 var(--dark-border),
        -3px -3px 0 var(--dark-border),
        3px -3px 0 var(--dark-border),
        -3px 3px 0 var(--dark-border),
        6px 6px 0 var(--primary-color);
      transform: rotate(-2deg);
    }

    header p {
      font-weight: 900;
      background: white;
      display: inline-block;
      padding: 4px 12px;
      border: 3px solid var(--dark-border);
      box-shadow: 3px 3px 0 var(--dark-border);
      margin-top: 8px;
      font-size: 1rem;
    }

    /* 主要容器：電腦版左右分割，手機版上下排列 */
    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      background: white;
      border: 4px solid var(--dark-border);
      box-shadow: var(--box-shadow-main);
      padding: 25px;
      border-radius: 12px;
    }

    @media (min-width: 850px) {
      .container {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    /* 左側控制面板區塊 */
    .controls-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel-title {
      font-family: 'Bangers', cursive;
      font-size: 1.8rem;
      color: var(--primary-color);
      border-bottom: 3px solid var(--dark-border);
      padding-bottom: 5px;
      letter-spacing: 1px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-weight: 900;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group label span.val-badge {
      background: var(--accent-color);
      border: 2px solid var(--dark-border);
      padding: 1px 6px;
      font-size: 0.8rem;
      border-radius: 4px;
    }

    /* 美式風格 Input 文字框 */
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      font-weight: bold;
      border: 3px solid var(--dark-border);
      border-radius: 6px;
      outline: none;
      box-shadow: 3px 3px 0 var(--dark-border);
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      background-color: #fffde7;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--dark-border);
    }

    /* 自訂圖片上傳按鈕樣式 */
    .file-upload-btn {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: var(--secondary-color);
      color: #121212;
      font-weight: 900;
      padding: 12px;
      border: 3px solid var(--dark-border);
      border-radius: 8px;
      box-shadow: 4px 4px 0 var(--dark-border);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      text-align: center;
    }

    .file-upload-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--dark-border);
    }

    .file-upload-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--dark-border);
    }

    .file-upload-btn input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* 滑桿 (Range Slider) 樣式 */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 10px;
      background: #ddd;
      border: 2px solid var(--dark-border);
      border-radius: 5px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--primary-color);
      border: 2px solid var(--dark-border);
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--dark-border);
    }

    /* 超酷一鍵下載按鈕 */
    .download-btn {
      margin-top: 10px;
      background: var(--accent-color);
      color: #121212;
      font-family: 'Bangers', 'Noto Sans TC', cursive;
      font-size: 1.6rem;
      letter-spacing: 1px;
      padding: 14px 20px;
      border: 4px solid var(--dark-border);
      border-radius: 8px;
      box-shadow: 5px 5px 0 var(--dark-border);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .download-btn:hover {
      background: #ffe600;
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0 var(--dark-border);
    }

    .download-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--dark-border);
    }

    /* 右側即時預覽區塊 */
    .preview-panel {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* 迷因畫布外框（html2canvas 擷取目標） */
    .meme-canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      background: #222;
      border: 4px solid var(--dark-border);
      box-shadow: var(--box-shadow-main);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    /* 預覽圖片 */
    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* 上方與下方迷因文字共通屬性 */
    .meme-text {
      position: absolute;
      width: 90%;
      left: 5%;
      text-align: center;
      font-family: 'Anton', 'Impact', sans-serif; /* 經典美式 Impact 粗體迷因字型 */
      text-transform: uppercase;
      color: white;
      line-height: 1.1;
      word-wrap: break-word;
      
      /* 強大黑色邊框的效果 (使用多重 text-shadow 確保所有視角清晰) */
      text-shadow: 
        3px 3px 0 #000,
       -3px -3px 0 #000,
        3px -3px 0 #000,
       -3px 3px 0 #000,
        0px 3px 0 #000,
        0px -3px 0 #000,
        3px 0px 0 #000,
       -3px 0px 0 #000,
        4px 4px 5px rgba(0,0,0,0.8);
    }

    .meme-text-top {
      top: 5%;
    }

    .meme-text-bottom {
      bottom: 5%;
    }

    /* 預設提示文字 */
    .placeholder-hint {
      position: absolute;
      color: rgba(255, 255, 255, 0.7);
      font-weight: bold;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 頁頭標題 -->
  <header>
    <h1>★ USA MEME MAKER ★</h1>
    <p>美式經典迷因產生器 - 快速製作你的原創梗圖！</p>
  </header>

  <!-- 主內容容器 -->
  <main class="container">

    <!-- 左側：控制面板 -->
    <section class="controls-panel">
      <h2 class="panel-title">1. 設定底圖</h2>
      
      <!-- 本機圖片上傳按鈕 (使用 input type=file 防範 CORS) -->
      <div class="file-upload-btn">
        <span>📸 選擇電腦中的圖片...</span>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <h2 class="panel-title" style="margin-top: 10px;">2. 輸入文字與微調</h2>

      <!-- 上方文字輸入框 -->
      <div class="form-group">
        <label for="topTextInput">上方文字 (Top Text)</label>
        <input type="text" id="topTextInput" placeholder="輸入上方搞笑文字..." value="WHEN YOU FINALLY">
      </div>

      <!-- 下方文字輸入框 -->
      <div class="form-group">
        <label for="bottomTextInput">下方文字 (Bottom Text)</label>
        <input type="text" id="bottomTextInput" placeholder="輸入下方搞笑文字..." value="FIX THE BUG AT 3 AM">
      </div>

      <!-- 字體大小滑桿 -->
      <div class="form-group">
        <label for="fontSizeSlider">
          字體大小 (Font Size)
          <span class="val-badge" id="fontSizeVal">36px</span>
        </label>
        <input type="range" id="fontSizeSlider" min="16" max="72" value="36">
      </div>

      <!-- 上方文字垂直位置滑桿 -->
      <div class="form-group">
        <label for="topPosSlider">
          上方文字位置 (Top Pos)
          <span class="val-badge" id="topPosVal">5%</span>
        </label>
        <input type="range" id="topPosSlider" min="0" max="40" value="5">
      </div>

      <!-- 下方文字垂直位置滑桿 -->
      <div class="form-group">
        <label for="bottomPosSlider">
          下方文字位置 (Bottom Pos)
          <span class="val-badge" id="bottomPosVal">5%</span>
        </label>
        <input type="range" id="bottomPosSlider" min="0" max="40" value="5">
      </div>

      <!-- 一鍵下載按鈕 -->
      <button class="download-btn" id="downloadBtn">
        🚀 一鍵下載迷因 (my-meme.png)
      </button>
    </section>

    <!-- 右側：迷因即時預覽區 -->
    <section class="preview-panel">
      <!-- 被 html2canvas 截圖的目標區塊 -->
      <div class="meme-canvas-wrapper" id="memeCanvas">
        <!-- 預設迷因圖（使用 SVG base64 佔位圖，避免外連 CORS 錯誤） -->
        <img id="memeImage" class="meme-image" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='400' viewBox='0 0 500 400'><rect width='100%' height='100%' fill='%23333333'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='20' font-weight='bold' fill='%23ffffff'>請點擊左側上傳照片</text></svg>" alt="迷因底圖">
        
        <!-- 即時上方文字 -->
        <div id="memeTopText" class="meme-text meme-text-top">WHEN YOU FINALLY</div>
        
        <!-- 即時下方文字 -->
        <div id="memeBottomText" class="meme-text meme-text-bottom">FIX THE BUG AT 3 AM</div>
      </div>
    </section>

  </main>

  <!-- ==========================================
       JavaScript 邏輯區
       ========================================== -->
  <script>
    // 1. 取得 DOM 元素引用
    const imageInput = document.getElementById('imageInput');
    const memeImage = document.getElementById('memeImage');
    
    const topTextInput = document.getElementById('topTextInput');
    const bottomTextInput = document.getElementById('bottomTextInput');
    const memeTopText = document.getElementById('memeTopText');
    const memeBottomText = document.getElementById('memeBottomText');

    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeVal = document.getElementById('fontSizeVal');
    
    const topPosSlider = document.getElementById('topPosSlider');
    const topPosVal = document.getElementById('topPosVal');
    
    const bottomPosSlider = document.getElementById('bottomPosSlider');
    const bottomPosVal = document.getElementById('bottomPosVal');

    const downloadBtn = document.getElementById('downloadBtn');
    const memeCanvas = document.getElementById('memeCanvas');

    // 2. 本機圖片讀取處理 (FileReader 防範 CORS)
    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        // 使用 FileReader 將使用者檔案轉為 Base64 Data URL
        const reader = new FileReader();
        reader.onload = function(event) {
          memeImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // 3. 上下文字即時同步 (Input 事件)
    topTextInput.addEventListener('input', function() {
      memeTopText.innerText = this.value;
    });

    bottomTextInput.addEventListener('input', function() {
      memeBottomText.innerText = this.value;
    });

    // 4. 滑桿微調控制 (字體大小 & 上下垂直位置)
    fontSizeSlider.addEventListener('input', function() {
      const size = this.value + 'px';
      memeTopText.style.fontSize = size;
      memeBottomText.style.fontSize = size;
      fontSizeVal.innerText = size;
    });

    topPosSlider.addEventListener('input', function() {
      const pos = this.value + '%';
      memeTopText.style.top = pos;
      topPosVal.innerText = pos;
    });

    bottomPosSlider.addEventListener('input', function() {
      const pos = this.value + '%';
      memeBottomText.style.bottom = pos;
      bottomPosVal.innerText = pos;
    });

    // 初始化字體大小
    memeTopText.style.fontSize = fontSizeSlider.value + 'px';
    memeBottomText.style.fontSize = fontSizeSlider.value + 'px';

    // 5. 使用 html2canvas 一鍵截圖下載功能
    downloadBtn.addEventListener('click', function() {
      // 顯示下載處理中的提示
      const originalBtnText = downloadBtn.innerHTML;
      downloadBtn.innerHTML = '⏳ 產生圖檔中...';
      downloadBtn.style.pointerEvents = 'none';

      // 呼叫 html2canvas 繪製 preview 區塊
      html2canvas(memeCanvas, {
        scale: 2,           // 2倍解析度，確保圖片高清不模糊
        useCORS: true,      // 允許跨域圖片（若有）
        allowTaint: true,
        backgroundColor: null
      }).then(canvas => {
        // 將 Canvas 轉為圖片 Data URL
        const imageURL = canvas.toDataURL('image/png');

        // 建立隱藏的 <a> 標籤觸發下載
        const link = document.createElement('a');
        link.download = 'my-meme.png'; // 依要求設定檔名為 my-meme.png
        link.href = imageURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // 恢復按鈕狀態
        downloadBtn.innerHTML = originalBtnText;
        downloadBtn.style.pointerEvents = 'auto';
      }).catch(err => {
        console.error('截圖失敗:', err);
        alert('下載圖片時發生錯誤，請重試！');
        downloadBtn.innerHTML = originalBtnText;
        downloadBtn.style.pointerEvents = 'auto';
      });
    });
  </script>
</body>
</html>
