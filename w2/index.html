<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？隨機抽籤機</title>
    <!-- Google Fonts 可愛圓潤字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
   
    <!-- 🎨 CSS 樣式區域 -->
    <style>
        /* 全局樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FFF5E6 0%, #FFD8A8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 中央卡片容器 */
        .card {
            background: #FFFFFF;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 140, 0, 0.15);
            text-align: center;
            position: relative;
            border: 4px solid #FFE3B3;
        }

        /* 頂部裝飾標籤 */
        .badge {
            display: inline-block;
            background: #FFF0F5;
            color: #FF8C00;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        /* 主標題樣式 */
        .main-title {
            color: #E65100;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 25px;
            min-height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        /* 生動彈跳動畫效果 (Bouncy Animation) */
        .bounce {
            animation: bounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 美食圖片容器與圖片 */
        .image-container {
            width: 100%;
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 按鈕樣式組合 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            border: none;
            border-radius: 50px;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
        }

        /* 抽籤主按鈕 (橘黃色系) */
        .primary-btn {
            background: linear-gradient(180deg, #FF9800 0%, #F57C00 100%);
            color: #FFFFFF;
            box-shadow: 0 6px 0 #E65100, 0 10px 15px rgba(245, 124, 0, 0.3);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #E65100, 0 12px 20px rgba(245, 124, 0, 0.4);
        }

        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #E65100;
        }

        /* 馬上出發按鈕 (地圖風格) */
        .map-btn {
            background: #4CAF50;
            color: #FFFFFF;
            box-shadow: 0 5px 0 #2E7D32, 0 8px 15px rgba(76, 175, 80, 0.3);
        }

        .map-btn:hover {
            background: #43A047;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #2E7D32;
        }

        .map-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2E7D32;
        }

        /* 隱藏元素用標籤 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 📄 HTML 內容區域 -->
    <div class="card">
        <!-- 裝飾小貼紙 -->
        <div class="badge">🍽️ 晚餐救星</div>
       
        <!-- 大標題區塊 -->
        <h1 id="title" class="main-title">今天吃什麼？</h1>
       
        <!-- 美食照片顯示區（抽籤後顯示） -->
        <div id="image-container" class="image-container hidden">
            <img id="food-image" src="" alt="美食照片">
        </div>
       
        <!-- 按鈕區塊 -->
        <div class="button-group">
            <button id="draw-btn" class="btn primary-btn">✨ 點我抽籤</button>
            <a id="map-btn" class="btn map-btn hidden" href="#" target="_blank" rel="noopener noreferrer">
                📍 馬上出發 (找附近美食)
            </a>
        </div>
    </div>

    <!-- ⚡ JavaScript 邏輯區域 -->
    <script>
        // 確保 DOM 載入完成後執行
        document.addEventListener('DOMContentLoaded', () => {

            // 1. 美食資料庫 (包含名稱、照片網址與地圖搜尋關鍵字)
            const foodList = [
                {
                    name: "海鮮",
                    image: "https://i.postimg.cc/Dysvbz2v/IMG-3471.avif",
                    query: "海鮮"
                },
                {
                    name: "多到爆的白飯",
                    image: "https://i.postimg.cc/6pcNd2Fn/IMG-3476.avif",
                    query: "多到爆的白飯"
                },
                {
                    name: "麥當勞 🍔",
                    image: "https://i.postimg.cc/JnBgdGYG/335DA9CD-82D2-494B-B5CA-1FC214AA8477.jpg",
                    query: "麥當勞"
                },
                {
                    name: "燒烤",
                    image: "https://i.postimg.cc/NftVpG6N/IMG-3495.avif",
                    query: "燒烤"
                },
                {
                    name: "億品鍋",
                    image: "https://i.postimg.cc/656c88Vr/18FF4305-59E0-4626-96AB-8B54FCE90895.jpg",
                    query: "億品鍋"
                }
            ];

            // 2. 取得 DOM 元素
            const titleEl = document.getElementById('title');
            const drawBtn = document.getElementById('draw-btn');
            const mapBtn = document.getElementById('map-btn');
            const imageContainer = document.getElementById('image-container');
            const foodImage = document.getElementById('food-image');

            let isRolling = false;

            // 3. 綁定按鈕點擊事件
            drawBtn.addEventListener('click', () => {
                if (isRolling) return;
                isRolling = true;

                // 點擊後禁用按鈕與重置狀態
                drawBtn.disabled = true;
                drawBtn.innerText = "抽取中...";
                titleEl.classList.remove('bounce');

                // 快速切換特效
                let counter = 0;
                const totalRolls = 20;
               
                const rollInterval = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * foodList.length);
                    titleEl.innerText = foodList[randomIndex].name;
                    counter++;

                    // 確定結果
                    if (counter >= totalRolls) {
                        clearInterval(rollInterval);
                       
                        const finalResult = foodList[Math.floor(Math.random() * foodList.length)];
                       
                        // 更新標題與觸發彈跳動畫
                        titleEl.innerText = finalResult.name;
                        titleEl.classList.add('bounce');

                        // 顯示照片
                        foodImage.src = finalResult.image;
                        imageContainer.classList.remove('hidden');

                        // 設定 Google Maps 連結
                        const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(finalResult.query)}`;
                        mapBtn.href = googleMapUrl;
                        mapBtn.classList.remove('hidden');

                        // 恢復按鈕
                        drawBtn.innerText = "🔄 再抽一次";
                        drawBtn.disabled = false;
                        isRolling = false;
                    }
                }, 80);
            });
        });
    </script>
</body>
</html>
